<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Oficial</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="calculator">
    <header class="calculator__header">
      <h1>Calculadora Oficial</h1>
    </header>

    <div class="calculator__display">
      <span class="calculator__expression" id="expression"></span>
      <span class="calculator__result" id="result">0</span>
    </div>

    <div class="calculator__keys">
      <!-- Row 1 -->
      <button class="key key--function" data-action="clear">C</button>
      <button class="key key--function" data-action="backspace">&#9003;</button>
      <button class="key key--function" data-action="percent">%</button>
      <button class="key key--operator" data-action="divide">&divide;</button>

      <!-- Row 2 -->
      <button class="key key--number" data-value="7">7</button>
      <button class="key key--number" data-value="8">8</button>
      <button class="key key--number" data-value="9">9</button>
      <button class="key key--operator" data-action="multiply">&times;</button>

      <!-- Row 3 -->
      <button class="key key--number" data-value="4">4</button>
      <button class="key key--number" data-value="5">5</button>
      <button class="key key--number" data-value="6">6</button>
      <button class="key key--operator" data-action="subtract">&minus;</button>

      <!-- Row 4 -->
      <button class="key key--number" data-value="1">1</button>
      <button class="key key--number" data-value="2">2</button>
      <button class="key key--number" data-value="3">3</button>
      <button class="key key--operator" data-action="add">+</button>

      <!-- Row 5 -->
      <button class="key key--number key--wide" data-value="0">0</button>
      <button class="key key--number" data-action="decimal">,</button>
      <button class="key key--equals" data-action="equals">=</button>
    </div>
  </div>

  <script src="js/calculator.js"></script>
</body>
</html>
